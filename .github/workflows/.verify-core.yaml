name: Verify Pure AST/Core/Common
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify_core:
    name: Verify Pure Packages (offline, dot-free)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit
      - name: Checkout Repo
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # Identical commands to local development; no graphviz installation and
      # no pre-generated parser artifacts are required on purpose.
      - name: Install Dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify ast/core/common
        run: corepack pnpm --filter @ts-graphviz/ast --filter @ts-graphviz/core --filter @ts-graphviz/common test

  verify_adapter:
    name: Verify Adapter (optional dot stage)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit
      - name: Checkout Repo
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: ./.node-version
          cache: pnpm
      - name: Install Dependencies
        run: corepack pnpm install --frozen-lockfile
      # Unit stage only: the adapter suite mocks child_process.spawn, so no
      # graphviz executable is needed. The live stage stays opt-in via
      # `node etc/verify/verify-adapter.mjs --live`.
      - name: Verify adapter (unit)
        run: corepack pnpm --filter @ts-graphviz/adapter test
