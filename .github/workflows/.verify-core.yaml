name: Verify Core (Offline)
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify_core:
    name: Verify Core (pure AST, no external dot)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: ./.node-version
      # Identical commands to the local entry point; no Graphviz is
      # installed on purpose so the core closure stays isolated from the
      # external dot adapter.
      - name: Install Dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify Core
        run: corepack pnpm verify:core
