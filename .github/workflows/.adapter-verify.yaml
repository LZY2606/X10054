name: Adapter Verify (Optional External Tool)
on:
  workflow_call:

permissions:
  contents: read

jobs:
  adapter:
    name: Adapter unit + optional dot smoke
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - name: Setup Node.js 20
        uses: actions/setup-node@2028fbc5c25fe9cf00d4e0059719c11c38c903 # v6.0.0
        with:
          node-version-file: ./.node-version
          cache: pnpm
      - name: Install Dependencies
        run: corepack pnpm install --frozen-lockfile
      # Optional stage: unit tests always run; the real dot smoke test is
      # reported as SKIPPED when Graphviz is unavailable.
      - name: Verify adapter (unit, dot smoke if available)
        run: corepack pnpm verify:adapter
