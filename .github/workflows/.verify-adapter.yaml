name: Verify Adapter (External dot)
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify_adapter:
    name: Verify Adapter (optional, external dot)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - name: Use Graphviz
        uses: ts-graphviz/setup-graphviz@b1de5da23ed0a6d14e0aeee8ed52fdd87af2363c # v2.0.2
      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: ./.node-version
      # Identical commands to the local entry point; the adapter stage is
      # explicitly optional and reported separately from the core verify.
      - name: Install Dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify Adapter
        run: corepack pnpm verify:adapter
